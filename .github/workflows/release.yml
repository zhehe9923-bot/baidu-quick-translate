name: release

# 两种触发方式：
#  1) 命令行：打 tag（v1.2.0）后 push，自动构建发布；
#  2) 只用浏览器：仓库 Actions 页面点「Run workflow」，填版本号即可发布。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（不带 v，例如 1.2.0）"
        required: true
        default: "1.2.0"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}".Trim().TrimStart("v")
          } else {
            if ("${{ github.ref_name }}" -notmatch '^v(.+)$') {
              throw "tag 必须以 v 开头，例如 v1.2.0"
            }
            $version = $Matches[1]
          }
          if (-not $version) { throw "版本号不能为空" }
          (Get-Content version.py -Raw) -replace 'APP_VERSION = ".*"', "APP_VERSION = `"$version`"" |
            Set-Content -Path version.py -NoNewline
          Get-Content version.py
          "version=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build (onedir)
        run: >
          python -m PyInstaller --noconfirm --clean --windowed --onedir
          --name 划词翻译 --icon "assets/icon.ico" --add-data "assets;assets"
          main.py

      - name: Package + version.json
        shell: pwsh
        run: |
          $version = "$env:version"
          New-Item -ItemType Directory -Force -Path "dist\划词翻译\docs" | Out-Null
          Copy-Item -Path "docs\UPDATE_PLAN.md" -Destination "dist\划词翻译\docs\UPDATE_PLAN.md" -Force
          Compress-Archive -Path "dist\划词翻译" -DestinationPath "BaiduQuickTranslate-win64.zip" -CompressionLevel Optimal
          $hash = (Get-FileHash "BaiduQuickTranslate-win64.zip" -Algorithm SHA256).Hash.ToLower()
          $commit = (git log -1 --pretty=%s)
          $payload = [ordered]@{
            version = $version
            url     = "https://github.com/${{ github.repository }}/releases/latest/download/BaiduQuickTranslate-win64.zip"
            sha256  = $hash
            notes   = "划词翻译 v$version`n`n$commit"
            page    = "https://github.com/${{ github.repository }}/releases/latest"
          }
          $json = $payload | ConvertTo-Json -Depth 4
          [System.IO.File]::WriteAllText("$PWD/version.json", $json, (New-Object System.Text.UTF8Encoding($false)))
          Get-Content version.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.version }}
          name: 划词翻译 v${{ env.version }}
          body: |
            划词翻译 v${{ env.version }}

            ${{ github.event.head_commit.message }}
          generate_release_notes: false
          files: |
            BaiduQuickTranslate-win64.zip
            version.json
